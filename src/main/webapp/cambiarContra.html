<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Clave</title>
    <!-- SB Admin 2 - CSS desde CDN -->
    <link href="https://cdn.jsdelivr.net/gh/StartBootstrap/startbootstrap-sb-admin-2/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center text-gray-800">Cambiar Clave</h2>
        <form action="cambiarContra" method="post" class="mt-4">
            <div class="form-group">
                <label class="text-gray-700">Clave Actual</label>
                <input type="password" name="actual" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="text-gray-700">Nueva Clave</label>
                <input type="password" name="nueva" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="text-gray-700">Confirmar Clave</label>
                <input type="password" name="confirma" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success btn-block">Actualizar Clave</button>
        </form>
    </div>
</body>
</html>
